name: Publish Runtime Loader

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

concurrency:
  group: publish-runtime-loader-${{ github.ref }}
  # A newer main commit supersedes older validation, but a release tag must run to completion.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate release metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          configured_version="$(
            sed -n 's/^version=//p' gradle/runtime-loader-release.properties | tail -n1 | tr -d '\r'
          )"
          if [[ -z "$configured_version" ]]; then
            echo "gradle/runtime-loader-release.properties does not define version" >&2
            exit 1
          fi

          release=false
          version="$configured_version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release=true
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Tag must be a Maven version such as 0.1.0-alpha01 or v0.1.0-alpha01" >&2
              exit 1
            fi
            if [[ "$version" != "$configured_version" ]]; then
              echo "Release tag version '$version' does not match configured version '$configured_version'" >&2
              exit 1
            fi
          fi

          changelog_heading="## $version"
          if ! grep -Fq "$changelog_heading" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain '$changelog_heading'" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release-check:
    name: Validate release packaging
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        name: Set up Android SDK

      - name: Install Android SDK required by release checks
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Run release packaging checks
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :runtime-loader:check \
            publishRuntimeLoaderToReleaseTestRepository \
            :demo:store:validateExtensionsStore

  jvm:
    name: Validate JVM
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install JVM desktop test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes xauth xvfb

      - name: Run JVM runtime-loader integration tests
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum ./gradlew \
            --no-daemon \
            --stacktrace \
            :demo:apps:jvm:runtimeLoaderJvmIntegrationTest \
            publishRuntimeLoaderToReleaseTestRepository
          ./gradlew \
            -p fixture/published-consumer \
            --no-daemon \
            --stacktrace \
            clean \
            :host:runtimeLoaderJvmIntegrationTest

  wasm:
    name: Validate WasmJs
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run WasmJs runtime-loader integration tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :demo:apps:web:runtimeLoaderWasmJsIntegrationTest

  android:
    name: Validate Android
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        name: Set up Android SDK

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Run Android validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :demo:apps:android:lintDebug \
            :demo:apps:android:assembleDebug

      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        name: Preserve Android validation reports
        with:
          name: runtime-loader-android-reports-${{ needs.prepare.outputs.version }}
          path: demo/apps/android/build/reports
          if-no-files-found: ignore
          retention-days: 5

  linux-x64:
    name: Validate Linux x64
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libibus-1.0-dev \
            libpng-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxtst-dev \
            ninja-build \
            pkg-config \
            wayland-protocols \
            xauth \
            xvfb \
            zlib1g-dev

          sdl_archive="$RUNNER_TEMP/SDL3-3.4.10.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$sdl_archive" \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.tar.gz
          echo '12b34280415ec8418c864408b93d008a20a6530687ee613d60bfbd20411f2785  '"$sdl_archive" | sha256sum --check
          tar --extract --gzip --file "$sdl_archive" --directory "$RUNNER_TEMP"
          cmake \
            -S "$RUNNER_TEMP/SDL3-3.4.10" \
            -B "$RUNNER_TEMP/SDL3-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF
          cmake --build "$RUNNER_TEMP/SDL3-build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/SDL3-build"
          sudo ldconfig

      - name: Run Linux runtime-loader integration tests
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum ./gradlew \
            --no-daemon \
            --stacktrace \
            :demo:apps:linux:runtimeLoaderNativeIntegrationTest \
            publishRuntimeLoaderToReleaseTestRepository
          xvfb-run --auto-servernum ./gradlew \
            -p fixture/published-consumer \
            --no-daemon \
            --stacktrace \
            clean \
            :host:runtimeLoaderNativeIntegrationTest

      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        name: Preserve Linux validation reports
        with:
          name: runtime-loader-linux-x64-reports-${{ needs.prepare.outputs.version }}
          path: build/reports
          if-no-files-found: ignore
          retention-days: 5

  linux-arm64-build:
    name: Build Linux arm64 runtime fixture
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Cross-build Linux arm64 runtime-loader fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :fixture:host:runtimeLoaderNativeBuildLinuxArm64
          file fixture/host/build/runtime-loader/linuxArm64/out/app.kexe | grep -Eq 'ARM aarch64|ARM64|aarch64'
          file fixture/host/build/runtime-loader/linuxArm64/out/libruntime-loader-module.so | grep -Eq 'ARM aarch64|ARM64|aarch64'

      - uses: actions/upload-artifact@v7.0.1
        name: Upload Linux arm64 runtime fixture
        with:
          name: runtime-loader-linux-arm64-fixture-${{ needs.prepare.outputs.version }}
          path: fixture/host/build/runtime-loader/linuxArm64/out
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        name: Preserve Linux arm64 build reports
        with:
          name: runtime-loader-linux-arm64-build-reports-${{ needs.prepare.outputs.version }}
          path: build/reports
          if-no-files-found: ignore
          retention-days: 5

  linux-arm64:
    name: Validate Linux arm64
    needs:
      - prepare
      - linux-arm64-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Verify Linux arm64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"

      - uses: actions/download-artifact@v8
        name: Download Linux arm64 runtime fixture
        with:
          name: runtime-loader-linux-arm64-fixture-${{ needs.prepare.outputs.version }}
          path: runtime-loader-linux-arm64-fixture

      - name: Run Linux arm64 runtime-loader integration test
        shell: bash
        run: |
          set -euo pipefail
          cd runtime-loader-linux-arm64-fixture
          chmod +x app.kexe
          file app.kexe | grep -Eq 'ARM aarch64|ARM64|aarch64'
          file libruntime-loader-module.so | grep -Eq 'ARM aarch64|ARM64|aarch64'
          ./app.kexe ./libruntime-loader-module.so

  extension-store:
    name: Validate extension store packaging
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        name: Set up Android SDK

      - name: Install Android SDK and Linux desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0'
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libibus-1.0-dev \
            libpng-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxtst-dev \
            llvm \
            ninja-build \
            pkg-config \
            wayland-protocols \
            zlib1g-dev

          sdl_archive="$RUNNER_TEMP/SDL3-3.4.10.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$sdl_archive" \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.tar.gz
          echo '12b34280415ec8418c864408b93d008a20a6530687ee613d60bfbd20411f2785  '"$sdl_archive" | sha256sum --check
          tar --extract --gzip --file "$sdl_archive" --directory "$RUNNER_TEMP"
          cmake \
            -S "$RUNNER_TEMP/SDL3-3.4.10" \
            -B "$RUNNER_TEMP/SDL3-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF
          cmake --build "$RUNNER_TEMP/SDL3-build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/SDL3-build"
          sudo ldconfig

      - name: Package the external extension store
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :demo:store:packageExternalExtensionStore

  windows:
    name: Validate native Windows x64
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run PE runtime smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat `
            --no-daemon `
            --stacktrace `
            :demo:apps:windows:runtimeLoaderNativeSmoke

  macos-arm64:
    name: Validate macOS arm64
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify Xcode
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install SDL3 framework
        shell: bash
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/SDL3-3.4.10.dmg"
          mountpoint="$RUNNER_TEMP/SDL3-mount"
          framework_dir="$RUNNER_TEMP/Frameworks"
          curl --fail --location --silent --show-error \
            --output "$dmg" \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.dmg
          printf '%s  %s\n' \
            36f78737dcd13a6e47ee066a6e460501a3de7fca678fe97fc3deab7d5ebc8b0f \
            "$dmg" | shasum -a 256 --check
          mkdir -p "$mountpoint" "$framework_dir"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true' EXIT
          sdl_framework="$(
            find -L "$mountpoint" -type d -name SDL3.framework -path '*macos*' -print -quit 2>/dev/null || true
          )"
          if [[ -z "$sdl_framework" || ! -d "$sdl_framework" ]]; then
            echo "The macOS SDL3.framework slice was not found inside the SDL release DMG" >&2
            find "$mountpoint" -maxdepth 4 -print >&2
            exit 1
          fi
          cp -R "$sdl_framework" "$framework_dir/"
          hdiutil detach "$mountpoint"
          trap - EXIT
          echo "COMPOSE_MACOS_SDL_FRAMEWORK_DIR=$framework_dir" >> "$GITHUB_ENV"

      - name: Run macOS arm64 Mach-O runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :runtime-loader:compileKotlinMacosArm64 \
            :demo:apps:macosArm64:runtimeLoaderNativeSmoke

  macos-x64:
    name: Validate macOS x64
    needs: prepare
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify Xcode
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install SDL3 framework
        shell: bash
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/SDL3-3.4.10.dmg"
          mountpoint="$RUNNER_TEMP/SDL3-mount"
          framework_dir="$RUNNER_TEMP/Frameworks"
          curl --fail --location --silent --show-error \
            --output "$dmg" \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.dmg
          printf '%s  %s\n' \
            36f78737dcd13a6e47ee066a6e460501a3de7fca678fe97fc3deab7d5ebc8b0f \
            "$dmg" | shasum -a 256 --check
          mkdir -p "$mountpoint" "$framework_dir"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true' EXIT
          sdl_framework="$(
            find -L "$mountpoint" -type d -name SDL3.framework -path '*macos*' -print -quit 2>/dev/null || true
          )"
          if [[ -z "$sdl_framework" || ! -d "$sdl_framework" ]]; then
            echo "The macOS SDL3.framework slice was not found inside the SDL release DMG" >&2
            find "$mountpoint" -maxdepth 4 -print >&2
            exit 1
          fi
          cp -R "$sdl_framework" "$framework_dir/"
          hdiutil detach "$mountpoint"
          trap - EXIT
          echo "COMPOSE_MACOS_SDL_FRAMEWORK_DIR=$framework_dir" >> "$GITHUB_ENV"

      - name: Run macOS x64 Mach-O runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :runtime-loader:compileKotlinMacosX64 \
            :demo:apps:macosX64:runtimeLoaderNativeSmoke

  ios:
    name: Validate iOS arm64
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Link iOS runtime-loader frameworks
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :demo:apps:ios:runtimeLoaderNativeBuildIosArm64

          test -d demo/apps/ios/build/runtime-loader/iosArm64/out/RuntimeLoaderDemoHost.framework
          test -d demo/apps/ios/build/runtime-loader/iosArm64/out/runtime-loader-about.framework
          test -d demo/apps/ios/build/runtime-loader/iosArm64/out/runtime-loader-counter.framework

      - name: Resolve the public Swift package
        shell: bash
        run: |
          set -euo pipefail
          swift package resolve
          swift package dump-package >/dev/null

  ios-simulator-arm64:
    name: Validate iOS Simulator arm64
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify Xcode and arm64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Compile iOS Simulator arm64 target
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :runtime-loader:compileKotlinIosSimulatorArm64

  publish:
    name: Publish Maven Central and Gradle Plugin Portal
    if: needs.prepare.outputs.release == 'true'
    needs:
      - prepare
      - release-check
      - jvm
      - wasm
      - android
      - linux-x64
      - linux-arm64
      - extension-store
      - windows
      - macos-x64
      - macos-arm64
      - ios
      - ios-simulator-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        name: Set up Android SDK

      - name: Install Android SDK required by KMP publication
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore Gradle properties and signing key
        shell: bash
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES_CONTENT }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PROPERTIES_CONTENT"
          test -n "$GPG_SECRET_KEY_RING_BASE64"
          gradle_dir="$HOME/.gradle"
          properties_file="$gradle_dir/gradle.properties"
          keyring="$gradle_dir/runtime-loader-secret-key.gpg"
          mkdir -p "$gradle_dir"
          printf '%s' "$GRADLE_PROPERTIES_CONTENT" > "$properties_file"
          printf '%s' "$GPG_SECRET_KEY_RING_BASE64" | tr -d '\r\n ' | openssl base64 -d -A > "$keyring"
          test -s "$keyring"
          awk '!/^signing.secretKeyRingFile=/' "$properties_file" > "$properties_file.tmp"
          mv "$properties_file.tmp" "$properties_file"
          printf '\nsigning.secretKeyRingFile=%s\n' "$keyring" >> "$properties_file"
          chmod 600 "$properties_file" "$keyring"

          required_properties=(
            mavenCentralUsername
            mavenCentralPassword
            signing.keyId
            signing.password
            gradle.publish.key
            gradle.publish.secret
          )
          for property in "${required_properties[@]}"; do
            if ! grep -Eq "^${property//./\.}=.+" "$properties_file"; then
              echo "GRADLE_PROPERTIES_CONTENT is missing required property '$property'" >&2
              exit 1
            fi
          done

      - name: Publish Kotlin Multiplatform library to Maven Central
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            -PmavenCentralPublishing=true \
            -PsignAllPublications=true \
            :runtime-loader:publishAndReleaseToMavenCentral

      - name: Publish reusable Gradle plugins
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            -p build-logic \
            --no-daemon \
            --stacktrace \
            validatePlugins \
            publishPlugins
